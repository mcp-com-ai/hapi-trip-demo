openapi: 3.1.0
info:
  title: Laura Trip Flights
  version: 1.0.0
  description: Synthetic local flight inventory for the Laura Capability Graph demonstration.
servers:
  - url: http://127.0.0.1:3100
paths:
  /flights:
    get:
      operationId: listFlights
      tags: [Flights]
      summary: Find available flights for Laura's trip
      x-hapi-capability: [Travel/Flights/Discovery]
      x-hapi-intent:
        use-when: [Laura needs flight choices before selecting one.]
        avoid-when: [A verified flight selection already exists.]
      x-hapi-effects: { mode: read, side-effecting: false, destructive: false, idempotent: true, requires-confirmation: false }
      x-hapi-prerequisites: []
      x-hapi-planning:
        produces: [{ predicate: flights.consulted }]
        cost: 1
      responses:
        '200': { description: Available flights, content: { application/json: { schema: { $ref: '#/components/schemas/Flights' } } } }
  /flights/selection:
    post:
      operationId: selectFlight
      tags: [Flights]
      summary: Record Laura's explicit flight selection
      x-hapi-capability: [Travel/Flights/Selection]
      x-hapi-intent:
        use-when: [Laura has chosen a listed flight.]
        avoid-when: [A search result has not been reviewed by Laura.]
      x-hapi-effects: { mode: action, side-effecting: false, destructive: false, idempotent: true, requires-confirmation: false }
      x-hapi-prerequisites: [A flight choice must be confirmed by Laura.]
      x-hapi-planning:
        requires: [{ predicate: flights.consulted }]
        produces: [{ predicate: flight.selected }]
        cost: 1
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flightId], properties: { flightId: { type: string, example: flight-cun-101 } } } } } }
      responses:
        '200': { description: Selected flight, content: { application/json: { schema: { $ref: '#/components/schemas/Selection' } } } }
  /flights/bookings:
    post:
      operationId: bookFlight
      tags: [Flights]
      summary: Book Laura's selected flight
      x-hapi-capability: [Travel/Flights/Booking]
      x-hapi-intent:
        use-when: [Laura's identity and flight selection are verified and she wants to book.]
        avoid-when: [The flight is only a search result or Laura has not approved booking.]
      x-hapi-effects: { mode: create, side-effecting: true, destructive: false, idempotent: false, requires-confirmation: true }
      x-hapi-prerequisites: [Verified traveller identity, Explicit flight selection, Booking confirmation]
      x-hapi-planning:
        requires: [{ predicate: traveller.identity.verified }, { predicate: flight.selected }]
        produces: [{ predicate: flight.booked }]
        cost: 1
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flightId, travellerId], properties: { flightId: { type: string }, travellerId: { type: string, example: laura-demo } } } } } }
      responses:
        '200': { description: Flight booking, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
  /flights/{flightId}:
    patch:
      operationId: modifyFlight
      tags: [Flights]
      summary: Change the departure date of a booked flight
      parameters: [{ name: flightId, in: path, required: true, schema: { type: string } }]
      x-hapi-capability: [Travel/Flights/Modification]
      x-hapi-intent: { use-when: [Laura wants to change a booked flight.], avoid-when: [No flight booking exists.] }
      x-hapi-effects: { mode: update, side-effecting: true, destructive: false, idempotent: false, requires-confirmation: true }
      x-hapi-prerequisites: [Verified booked flight, Booking confirmation]
      x-hapi-planning:
        requires: [{ predicate: flight.booked }]
        produces: [{ predicate: flight.modified }]
        cost: 1
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [departureDate], properties: { departureDate: { type: string, format: date, example: '2026-10-12' } } } } } }
      responses: { '200': { description: Modified flight, content: { application/json: { schema: { type: object } } } } }
  /flights/{flightId}/cancellation:
    post:
      operationId: cancelFlight
      tags: [Flights]
      summary: Cancel Laura's booked flight
      parameters: [{ name: flightId, in: path, required: true, schema: { type: string } }]
      x-hapi-capability: [Travel/Flights/Cancellation]
      x-hapi-intent: { use-when: [Laura explicitly wants to cancel a booked flight.], avoid-when: [The flight is not booked.] }
      x-hapi-effects: { mode: delete, side-effecting: true, destructive: true, idempotent: true, requires-confirmation: true }
      x-hapi-prerequisites: [Verified booked flight, Explicit cancellation confirmation]
      x-hapi-planning:
        requires: [{ predicate: flight.booked }]
        produces: [{ predicate: flight.cancelled }]
        removes: [{ predicate: flight.booked }]
        cost: 1
      responses: { '200': { description: Cancelled flight, content: { application/json: { schema: { type: object } } } } }
components:
  schemas:
    Flights: { type: object, required: [flights], properties: { flights: { type: array, items: { $ref: '#/components/schemas/Flight' } } } }
    Flight: { type: object, required: [id, route, date, status], properties: { id: { type: string }, route: { type: string }, date: { type: string }, status: { type: string } } }
    Selection: { type: object, properties: { selectedFlight: { type: object } } }
    Booking: { type: object, properties: { bookingId: { type: string }, flightId: { type: string }, travellerId: { type: string }, status: { type: string } } }
